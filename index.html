<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MykelHub — centralized store management for inventory and sales." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>MykelHub — Centralized Store Management</title>
    <script>
      // Resolve the stored theme and style before first paint to avoid a flash.
      document.documentElement.dataset.style = 'futuristic'
      try {
        var raw = localStorage.getItem('mykelhub.store')
        var settings = raw ? JSON.parse(raw).state.settings : {}
        var theme = settings.theme || 'system'
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
        if (settings.style === 'soft') document.documentElement.dataset.style = 'soft'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
